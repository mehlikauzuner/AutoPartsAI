<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutoPartsAI | Ruhsat Asistanı</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; background: #f3f6fb; color: #172033; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .app { width: min(720px, 100%); height: min(760px, calc(100vh - 40px)); display: flex; flex-direction: column; overflow: hidden; border: 1px solid #e4e9f1; border-radius: 20px; background: #fff; box-shadow: 0 16px 48px #24324b14; }
    header { display: flex; align-items: center; gap: 12px; padding: 18px 22px; border-bottom: 1px solid #edf0f5; }
    .logo { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 13px; color: white; background: #2768dc; font-weight: 700; }
    header strong, header span { display: block; }
    header span { margin-top: 3px; color: #718096; font-size: 13px; }
    #messages { flex: 1; overflow-y: auto; padding: 24px; }
    .message { max-width: 85%; margin-bottom: 16px; }
    .message.user { margin-left: auto; }
    .bubble { padding: 12px 15px; border-radius: 5px 15px 15px; background: #f1f4f9; font-size: 14px; line-height: 1.55; white-space: pre-line; overflow-wrap: anywhere; }
    .user .bubble { border-radius: 15px 5px 15px 15px; color: white; background: #2768dc; }
    .composer { padding: 14px 18px; border-top: 1px solid #edf0f5; }
    .controls { display: flex; align-items: center; gap: 10px; padding: 8px; border: 1px solid #dce3ee; border-radius: 15px; }
    button { padding: 10px 13px; border: 0; border-radius: 10px; font: inherit; cursor: pointer; }
    #chooseFile { color: #34435b; background: #f0f3f8; }
    #fileName { flex: 1; overflow: hidden; color: #758198; font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
    #sendButton { color: white; background: #2768dc; font-weight: 600; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    .hint { margin: 8px 4px 0; color: #8b95a7; font-size: 11px; text-align: center; }
    @media (max-width: 560px) { body { padding: 0; } .app { height: 100vh; border: 0; border-radius: 0; } #messages { padding: 18px 14px; } .composer { padding: 12px; } }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="logo">AP</div>
      <div><strong>AutoPartsAI</strong><span>Ruhsat Asistanı</span></div>
    </header>

    <section id="messages" aria-live="polite">
      <div class="message"><div class="bubble">Merhaba! Ruhsat görselini yükle, araç bilgilerini senin için okuyayım.</div></div>
    </section>

    <form class="composer" id="uploadForm">
      <div class="controls">
        <input id="fileInput" type="file" accept="image/*" hidden>
        <button id="chooseFile" type="button">Görsel seç</button>
        <span id="fileName">JPG veya PNG dosyası seç</span>
        <button id="sendButton" type="submit" disabled>Gönder</button>
      </div>
      <div class="hint">Ruhsat fotoğrafını seçip Gönder’e tıkla.</div>
    </form>
  </main>

  <script>
    const form = document.getElementById("uploadForm");
    const input = document.getElementById("fileInput");
    const send = document.getElementById("sendButton");
    const messages = document.getElementById("messages");

    document.getElementById("chooseFile").onclick = () => input.click();
    input.onchange = () => {
      document.getElementById("fileName").textContent = input.files[0]?.name || "JPG veya PNG dosyası seç";
      send.disabled = !input.files.length;
    };

    function addMessage(text, isUser = false) {
      const row = document.createElement("div");
      row.className = isUser ? "message user" : "message";
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      row.append(bubble);
      messages.append(row);
      messages.scrollTop = messages.scrollHeight;
      return row;
    }

    form.onsubmit = async (event) => {
      event.preventDefault();
      const file = input.files[0];
      if (!file) return;

      addMessage(file.name, true);
      const waiting = addMessage("Ruhsat inceleniyor…");
      const body = new FormData();
      body.append("file", file);
      send.disabled = true;
      document.getElementById("chooseFile").disabled = true;

      try {
        const response = await fetch("/vehicles/upload-registration", { method: "POST", body });
        const data = await response.json();
        waiting.remove();
        if (!response.ok) {
          addMessage("Bazı bilgiler okunamadı. Daha net ve düz bir fotoğraf deneyebilir misin?");
        } else {
          const fields = [["VIN", data.vin], ["Marka", data.brand], ["Model", data.model], ["Model yılı", data.year], ["Motor hacmi", data.engine], ["Yakıt türü", data.fuel_type]];
          addMessage("Ruhsattan bulduğum bilgiler:\n" + fields.map(([name, value]) => `${name}: ${value || "Okunamadı"}`).join("\n"));
          input.value = "";
          document.getElementById("fileName").textContent = "JPG veya PNG dosyası seç";
        }
      } catch {
        waiting.remove();
        addMessage("Sunucuya ulaşılamadı. API'nin çalıştığını kontrol et.");
      }

      document.getElementById("chooseFile").disabled = false;
      send.disabled = !input.files.length;
    };
  </script>
</body>
</html>
